# Keep CI actions and pip deps patched. CI runs the full offline suite on
# every Dependabot PR.
#
# requirements.txt is deliberately unpinned today, and Dependabot only
# proposes bumps for pinned or ranged requirements, so the pip entry stays
# quiet until something is pinned. Security alerts do not depend on it.
# Routine bumps are grouped: one PR per ecosystem per week.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
