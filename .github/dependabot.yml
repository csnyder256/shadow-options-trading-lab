# Keep CI actions and pip deps patched. CI runs the full offline suite on
# every Dependabot PR.
#
# requirements.txt and requirements-backtest.txt use open floors (>=) or no
# constraint at all, so pip already installs the newest compatible release.
# increase-if-necessary stops Dependabot from raising those floors on every
# release, which changes nothing that gets installed; it still opens a PR
# when a release falls outside an allowed range. Routine bumps are grouped:
# one PR per ecosystem per week.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
